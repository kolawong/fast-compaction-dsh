# DeepSeek Harness — Fast Compaction settings card plugin
#
# Server entry only: registers the `fast-compaction` settings namespace so the
# engine's `~/.dsh/settings.yaml` section is owned, validated and editable
# from the Web UI. All effective defaults live in the schema/base layer inside
# index.js, so this entry carries no config.
- insert:
    - id: fast-compaction
      name: 'dsh-plugin-fast-compaction'
      inject:
        - settings
