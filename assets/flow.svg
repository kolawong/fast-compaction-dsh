<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 600" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8b949e"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3fb950"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d29922"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#f85149"/>
    </marker>
    <marker id="arrowDash" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6e7681"/>
    </marker>
  </defs>

  <rect width="980" height="600" rx="12" fill="#0d1117"/>
  <text x="490" y="38" text-anchor="middle" font-size="19" font-weight="700" fill="#e6edf3">fast-compaction-dsh — verdict-based compaction</text>
  <text x="490" y="60" text-anchor="middle" font-size="12.5" fill="#8b949e">nothing is rewritten; stale tool calls are scored by jev-latest and deleted or truncated, everything kept stays verbatim</text>

  <!-- Lane 1: pipeline -->
  <!-- Box 1: trigger -->
  <rect x="30" y="96" width="170" height="64" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="115" y="122" text-anchor="middle" font-size="13" font-weight="600" fill="#e6edf3">pressure / /compact</text>
  <text x="115" y="142" text-anchor="middle" font-size="11" fill="#8b949e">DSH compaction seam</text>

  <line x1="200" y1="128" x2="238" y2="128" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Box 2: region -->
  <rect x="244" y="96" width="180" height="64" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="334" y="118" text-anchor="middle" font-size="13" font-weight="600" fill="#e6edf3">select region</text>
  <text x="334" y="136" text-anchor="middle" font-size="11" fill="#8b949e">recent tail retained · tool</text>
  <text x="334" y="150" text-anchor="middle" font-size="11" fill="#8b949e">pairs never split</text>

  <line x1="424" y1="128" x2="462" y2="128" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Box 3: fit state -->
  <rect x="468" y="96" width="190" height="64" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="563" y="118" text-anchor="middle" font-size="13" font-weight="600" fill="#e6edf3">fit state ≤ 25k tokens</text>
  <text x="563" y="136" text-anchor="middle" font-size="11" fill="#8b949e">results → size notes · inputs</text>
  <text x="563" y="150" text-anchor="middle" font-size="11" fill="#8b949e">truncated in stages</text>

  <line x1="658" y1="128" x2="696" y2="128" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Box 4: Jev -->
  <rect x="702" y="88" width="248" height="80" rx="10" fill="#161b22" stroke="#bc8cff" stroke-width="1.5"/>
  <text x="826" y="112" text-anchor="middle" font-size="13" font-weight="700" fill="#bc8cff">jev-latest (System One)</text>
  <text x="826" y="130" text-anchor="middle" font-size="11" fill="#8b949e">2 noul questions per call</text>
  <text x="826" y="144" text-anchor="middle" font-size="11" fill="#8b949e">keepCall? · keepResult?</text>
  <text x="826" y="158" text-anchor="middle" font-size="11" fill="#8b949e">one fast request, ~700 ms</text>

  <!-- Down to decision -->
  <line x1="826" y1="168" x2="826" y2="206" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Decision box -->
  <rect x="666" y="212" width="320" height="52" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="826" y="234" text-anchor="middle" font-size="13" font-weight="600" fill="#e6edf3">decision per call (threshold 0.5)</text>
  <text x="826" y="252" text-anchor="middle" font-size="11" fill="#8b949e">pinned first + newest messages are never touched</text>

  <!-- three outcomes -->
  <line x1="690" y1="264" x2="195" y2="318" stroke="#3fb950" stroke-width="1.5" marker-end="url(#arrowGreen)"/>
  <line x1="780" y1="264" x2="490" y2="318" stroke="#d29922" stroke-width="1.5" marker-end="url(#arrowAmber)"/>
  <line x1="900" y1="264" x2="785" y2="318" stroke="#f85149" stroke-width="1.5" marker-end="url(#arrowRed)"/>

  <!-- keep -->
  <rect x="60" y="324" width="270" height="74" rx="10" fill="#0f1a12" stroke="#3fb950" stroke-width="1.5"/>
  <text x="195" y="348" text-anchor="middle" font-size="13" font-weight="700" fill="#3fb950">keep verbatim</text>
  <text x="195" y="366" text-anchor="middle" font-size="11" fill="#8b949e">keepResult ≥ 0.5</text>
  <text x="195" y="382" text-anchor="middle" font-size="11" fill="#8b949e">call + full result, untouched</text>

  <!-- truncate -->
  <rect x="370" y="324" width="240" height="74" rx="10" fill="#1a150a" stroke="#d29922" stroke-width="1.5"/>
  <text x="490" y="348" text-anchor="middle" font-size="13" font-weight="700" fill="#d29922">truncate result</text>
  <text x="490" y="366" text-anchor="middle" font-size="11" fill="#8b949e">keepCall ≥ 0.5 only</text>
  <text x="490" y="382" text-anchor="middle" font-size="11" fill="#8b949e">call stays · result → 300-char head</text>

  <!-- drop -->
  <rect x="650" y="324" width="270" height="74" rx="10" fill="#1c0f10" stroke="#f85149" stroke-width="1.5"/>
  <text x="785" y="348" text-anchor="middle" font-size="13" font-weight="700" fill="#f85149">drop call + result</text>
  <text x="785" y="366" text-anchor="middle" font-size="11" fill="#8b949e">both below 0.5</text>
  <text x="785" y="382" text-anchor="middle" font-size="11" fill="#8b949e">stale · re-runnable · gone</text>

  <!-- converge to checkpoint -->
  <line x1="195" y1="398" x2="430" y2="452" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="490" y1="398" x2="490" y2="452" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="785" y1="398" x2="560" y2="452" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- checkpoint -->
  <rect x="300" y="458" width="380" height="64" rx="10" fill="#101d2b" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="490" y="482" text-anchor="middle" font-size="13.5" font-weight="700" fill="#58a6ff">verbatim transcript checkpoint</text>
  <text x="490" y="500" text-anchor="middle" font-size="11" fill="#8b949e">user &amp; assistant text is never removed or rewritten</text>
  <text x="490" y="514" text-anchor="middle" font-size="11" fill="#8b949e">one durable user message replaces the shadowed span</text>

  <!-- Fallback lane -->
  <line x1="115" y1="160" x2="115" y2="536" stroke="#6e7681" stroke-width="1.3" stroke-dasharray="5 4"/>
  <line x1="115" y1="536" x2="158" y2="536" stroke="#6e7681" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#arrowDash)"/>
  <rect x="164" y="530" width="330" height="30" rx="8" fill="#161b22" stroke="#6e7681" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="329" y="549" text-anchor="middle" font-size="11.5" fill="#8b949e">no key · Jev error · unfittable · reduction &lt; 25%</text>
  <line x1="494" y1="545" x2="548" y2="545" stroke="#6e7681" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#arrowDash)"/>
  <rect x="554" y="530" width="366" height="30" rx="8" fill="#161b22" stroke="#6e7681" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="737" y="549" text-anchor="middle" font-size="11.5" fill="#8b949e">fallback → built-in LLM summary (compaction-basic)</text>
</svg>
